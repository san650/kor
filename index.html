<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>KOR Companion</title>
  <meta name="description" content="Tainted Grail: Reyes de la Perdición — Companion" />
  <meta name="theme-color" content="#15090a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="KOR" />

  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  <link rel="apple-touch-icon" href="./icon.svg" />

  <link rel="apple-touch-startup-image" href="./splash/splash-1290x2796.png"
        media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
  <link rel="apple-touch-startup-image" href="./splash/splash-1179x2556.png"
        media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
  <link rel="apple-touch-startup-image" href="./splash/splash-1284x2778.png"
        media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
  <link rel="apple-touch-startup-image" href="./splash/splash-1170x2532.png"
        media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
  <link rel="apple-touch-startup-image" href="./splash/splash-1125x2436.png"
        media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
  <link rel="apple-touch-startup-image" href="./splash/splash-1242x2688.png"
        media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
  <link rel="apple-touch-startup-image" href="./splash/splash-828x1792.png"
        media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
  <link rel="apple-touch-startup-image" href="./splash/splash-1242x2208.png"
        media="(device-width: 414px) and (device-height: 736px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
  <link rel="apple-touch-startup-image" href="./splash/splash-750x1334.png"
        media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />

  <link rel="stylesheet" href="./fonts/fonts.css" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="vellum" aria-hidden="true"></div>

  <header class="tome-head">
    <h1 class="tome-head__title">
      <span class="tome-head__word tome-head__word--kor">KOR</span>
      <span class="tome-head__word tome-head__word--companion">Companion</span>
    </h1>
  </header>

  <main id="view" class="tome"></main>

  <nav class="tabs" role="tablist" aria-label="Secciones">
    <button id="drawer-knob" class="drawer-knob" type="button"
            aria-label="Más opciones" aria-expanded="false" aria-controls="drawer">
      <span class="drawer-knob__handle" aria-hidden="true"></span>
    </button>
    <button class="tab" role="tab" data-tab="exploration" aria-selected="true">
      <span class="tab__glyph" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"/>
          <path d="M12 3.5 L13.2 12 L12 20.5 L10.8 12 Z" fill="currentColor" stroke="none"/>
          <path d="M3.5 12 L12 13.2 L20.5 12 L12 10.8 Z" fill="currentColor" stroke="none" opacity=".55"/>
          <circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/>
        </svg>
      </span>
      <span class="tab__name">Andanzas</span>
    </button>
    <button class="tab" role="tab" data-tab="statuses" aria-selected="false">
      <span class="tab__glyph" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 4 C14 4 15.2 5.6 15.2 7.5 C17 7.5 19 8.8 19 11 C19 13.2 17 14.5 15.2 14.5 C15.2 16.4 14 18 12 18 C10 18 8.8 16.4 8.8 14.5 C7 14.5 5 13.2 5 11 C5 8.8 7 7.5 8.8 7.5 C8.8 5.6 10 4 12 4 Z"/>
          <circle cx="12" cy="11" r="1.4" fill="currentColor" stroke="none"/>
        </svg>
      </span>
      <span class="tab__name">Estados</span>
    </button>
    <button class="tab" role="tab" data-tab="heroes" aria-selected="false">
      <span class="tab__glyph" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 4 V21"/>
          <path d="M6 5 H18 L15 9 L18 13 H6"/>
        </svg>
      </span>
      <span class="tab__name">Héroes</span>
    </button>
  </nav>

  <dialog id="prompt-dialog" class="prompt" aria-labelledby="prompt-title">
    <form method="dialog" class="prompt__card">
      <h2 id="prompt-title" class="prompt__title">Inscribir</h2>
      <p id="prompt-body" class="prompt__body" hidden></p>
      <label class="prompt__field">
        <span id="prompt-label" class="prompt__label">Nombre</span>
        <input id="prompt-input" type="text" autocomplete="off" autocapitalize="words" spellcheck="false" />
      </label>
      <div class="prompt__actions">
        <button type="button" class="btn btn--ghost" data-prompt-cancel>Cancelar</button>
        <button type="submit" class="btn btn--ink" data-prompt-accept>Inscribir</button>
      </div>
    </form>
  </dialog>

  <dialog id="confirm-dialog" class="prompt" aria-labelledby="confirm-title">
    <form method="dialog" class="prompt__card">
      <h2 id="confirm-title" class="prompt__title">¿Borrar del tomo?</h2>
      <p id="confirm-body" class="prompt__body"></p>
      <div class="prompt__actions">
        <button type="button" class="btn btn--ghost" data-confirm-cancel>Conservar</button>
        <button type="submit" class="btn btn--blood" data-confirm-accept>Borrar</button>
      </div>
    </form>
  </dialog>

  <dialog id="hero-picker-dialog" class="prompt" aria-labelledby="hero-picker-title">
    <form method="dialog" class="prompt__card prompt__card--picker">
      <h2 id="hero-picker-title" class="prompt__title">Añadir héroe</h2>
      <p class="prompt__body">Elige uno de los héroes que jugarán esta sesión.</p>
      <ul id="hero-picker-list" class="hero-picker"></ul>
      <div class="prompt__actions">
        <button type="button" class="btn btn--ghost" data-hero-picker-cancel>Cancelar</button>
      </div>
    </form>
  </dialog>

  <dialog id="edit-dialog" class="prompt" aria-labelledby="edit-title">
    <form method="dialog" class="prompt__card">
      <h2 id="edit-title" class="prompt__title">Editar</h2>
      <label class="prompt__field">
        <span id="edit-label-text" class="prompt__label">Descripción</span>
        <input id="edit-input-text" type="text" autocomplete="off" autocapitalize="sentences" spellcheck="false" />
      </label>
      <label id="edit-field-loc" class="prompt__field" hidden>
        <span class="prompt__label">N.º de localización</span>
        <input id="edit-input-loc" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" inputmode="numeric" placeholder="101" />
      </label>
      <div class="prompt__actions">
        <button type="button" class="btn btn--ghost" data-edit-cancel>Cancelar</button>
        <button type="submit" class="btn btn--ink" data-edit-accept>Guardar</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="./app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
    }
  </script>
</body>
</html>
